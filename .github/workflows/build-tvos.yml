name: Build tvOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # SwiftfinMacros 是本地宏包，CI 环境跳过宏指纹校验
      - name: Allow macros on CI
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # 缓存 DerivedData + SPM（两者都在 -derivedDataPath build 下）
      # 键随 Package.resolved 变化；restore-keys 兜底增量恢复
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: tvos-build-${{ hashFiles('Swiftfin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            tvos-build-

      # 依赖按 Package.resolved 锁定的精确版本解析，禁止升级
      - name: Resolve dependencies
        working-directory: .
        run: |
          set -o pipefail
          # 只清过期构建计划，保留 clonedSourcePackages（省去每次全量重新下载 SPM 依赖；
          # 依赖变更时 cache key 随 Package.resolved 变化，自然拿到全新缓存）
          rm -rf build/XCBuildData
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme "Swiftfin tvOS" \
            -derivedDataPath build

      # 未签名编译：CODE_SIGNING_ALLOWED=NO 跳过证书/描述文件
      # 批量化 Swift 编译在 Xcode 27 已是默认行为（旧参数 -enable-batch-mode 已被移除）
      - name: Build (unsigned)
        working-directory: .
        run: |
          set -o pipefail
          xcodebuild \
            -project Swiftfin.xcodeproj \
            -scheme "Swiftfin tvOS" \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath build \
            -disableAutomaticPackageResolution \
            SWIFT_VERSION=5.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        working-directory: .
        run: |
          APP=$(find build/Build/Products/Release-appletvos -maxdepth 1 -name "*.app" | head -1)
          echo "Found app bundle: $APP"
          if [ -z "$APP" ]; then echo "::error::No .app produced - build failed"; exit 1; fi
          if [ ! -d "$APP" ]; then echo "::error::$APP is not a directory"; exit 1; fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry "../Swiftfin-FNOS-tvos-unsigned.ipa" Payload
          cd ..
          ls -lh Swiftfin-FNOS-tvos-unsigned.ipa

      # 失败也保存缓存：失败轮次里已编译的依赖/模块不浪费
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build
          key: tvos-build-${{ hashFiles('Swiftfin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-FNOS-tvos-unsigned
          path: Swiftfin-FNOS-tvos-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # 如需在 CI 直接出「已签名 ipa」（需要付费开发者账号）：
      # 1. 在仓库 Settings → Secrets 添加：
      #    BUILD_CERTIFICATE_BASE64 / P12_PASSWORD
      #    PROVISIONING_PROFILE_BASE64（tvOS 通配或指定 App ID）
      #    KEYCHAIN_PASSWORD / EXPORT_OPTIONS_PLIST_BASE64
      # 2. 在上面 Package 步骤前插入：导入证书到临时钥匙串 →
      #    xcodebuild -exportArchive -exportOptionsPlist ExportOptions.plist
      # 参考 fastlane match 或 apple-actions/import-codesign-certs。
